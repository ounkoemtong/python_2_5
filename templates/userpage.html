<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>


    <div class="container d-flex gap-2 mt-2">
        {% for datas in data %}
        <div class="card" style="width: 18rem; height: 350px;">
             <img width="100%" height="60%" style="border-radius: 50%;"
                            src="{{ url_for('static', filename='uploads/' + datas[5]) }}">
            <div class="card-body">
                <h5 class="card-title">{{datas[1]}}</h5>
                <p class="card-text">{{datas[4]}}</p>
                <a href="#" class="btn btn-primary">{{datas[2]}}$</a>
            </div>
        </div>

        {% endfor %}
    </div>






</body>

</html>
